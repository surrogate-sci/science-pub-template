title: Surrogate Science Publication Theme
author: Surrogate Science
version: 1.1.0
quarto-required: ">=1.8.25"
contributes:
  formats:
    html:
      css:
        - css/main.css
        - css/citation-box.css
      include-in-header:
        - file: includes/fonts.html
        - file: includes/author-reveal.html
        - file: includes/mini-title.html
        - file: includes/version-in-title.html
        - file: includes/citation-box.html
      highlight-style: surrogate-light.theme
      page-layout: article
      title-block-banner: true
      toc: true
      toc-expand: 2
