name: Validate AI usage disclosure

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install YAML parser
        run: python -m pip install pyyaml==6.0.2

      - name: Validate AI usage disclosure
        run: python scripts/generate_ai_disclosure.py ai-use.yml --check
